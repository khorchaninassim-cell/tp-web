<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercice 4</title>
</head>
<body>
    <form action="" method="post">
            <fieldset>
                <legend>Votre identite</legend>
                <ol>
                    <li><label for="">Nom</label><input type="text" placeholder="Prenom et nom"></li>
                    <li><label for="">Email</label><input type="email" placeholder="Exemple@gmail.com"></li>
                    <li><label for="">Telephone</label><input type="tel" placeholder="par ex :+33755000000"></li>
                </ol>
            </fieldset>
            <fieldset>
                <legend>Adresse de livraison</legend>
                <ol>
                    <li><label for="">Adresse</label><textarea name="" id=""></textarea></li>
                    <li><label for="">Code postal</label><input type="text"></li>
                    <li><label for="">Pays</label><input type="text"></li>
                </ol>
            </fieldset>
            <fieldset>
                <legend>Information CB</legend>
                <ol>
                    <li>
                        <fieldset>
                            <legend>Type de carte bancaire</legend>
                            <ol>
                                <li><input type="radio" name="b" id="">VISA</li>
                                <li><input type="radio" name="b" id="">AmEx</li>
                                <li><input type="radio" name="b" id="">Mastercard</li>
                            </ol>
                        </fieldset>
                    </li>
                    <li><label for="">N° de carte</label><input type="number" name="" id=""></li>
                    <li><label for="">Code sécurité</label><input type="password"></li>
                    <li><label for="">Nom du porteur</label><input type="text"></li>
                </ol>
            </fieldset>
            <fieldset>
                <input type="submit" value="J'achete !">
            </fieldset>
    </form>
</body>
</html>
